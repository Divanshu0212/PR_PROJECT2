[project]
name = "rho"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "docling>=2.0",
    "rapidfuzz>=3",
    "sentence-transformers>=3",
    "keybert>=0.8",
    "numpy",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib",
    "langgraph>=0.2",
    # Groq backend transport: Cloudflare rejects urllib's fingerprint with
    # 403/1010 before the request reaches Groq, so httpx is a runtime need.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "hypothesis>=6", "python-docx>=1.1"]
llm = ["outlines>=0.1", "vllm>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
